      parameters:
        delta_state: domain-specific vector
        effect: '[-1,1]'
        latency: time
        duration: time
        confidence: '[0,1]'
        context: structured context
      formulas:
      - Delta X = X(t1) - X(t0)
      - Delta D_N = d(X(t1), X_desired) - d(X(t0), X_desired)
    - id: state_event
      source: State
