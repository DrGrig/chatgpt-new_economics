    evolution:
      allowed_change_types:
      - minor
      - structural
      - fundamental
      versioning_required: true
      provenance_required: true
      deprecated_before_archived: true
      change_record_fields:
      - type
      - target
      - old
      - new
      - reason
      - evidence
      - author_or_system
      - time
      - confidence
      - version_from
      - version_to
  live_ontology:
    purpose: Runtime layer for concrete instances, observations, state updates, fuzzy memberships, confidence values and provenance.
    instance_structure:
      entity_id: globally unique identifier
      classes:
        ClassName:
          membership_value: '[0,1]'
          confidence: '[0,1]'
      properties:
        property_name:
          value: typed value
          unit: optional
          timestamp: required for dynamic data
          confidence: '[0,1]'
          provenance: source/method/version
      relations:
      - relation_type: relation identifier
        target_entity_id: entity id
        parameters: relation-specific parameters
        timestamp: timestamp or interval
        confidence: '[0,1]'
        provenance: source/method/version
      states:
      - state_id: unique state identifier
        timestamp: timestamp/interval
        variables: state vector
        confidence: '[0,1]'
        provenance: source/method/version
    update_pipeline:
    - ingest_data
    - validate_schema
    - map_to_entities
    - update_properties
    - update_relations
    - update_states
    - instantiate_or_update_need_instances
    - compute_need_parameters
    - compute_N_i_abs
    - aggregate_need_instances
    - compute_H_R
    - normalize_to_D_R_if_H_R_positive
    - recalculate_fuzzy_memberships
    - recalculate_confidence
    - detect_constraint_violations
    - record_provenance
    - version_snapshot
  needs_matrix_model:
    hierarchy:
      levels:
      - NeedType
      - Subcategory
      - NeedInstance
      rule: NeedInstance is instantiated for a concrete Entity/group and time/context.
    top_level_need_types_v1:
    - ExistenceMaintenance
    - PhysicalFunctionalIntegrity
    - Safety
    - EnvironmentAndSpace
    - AccessToResources
    - InformationAndCognition
    - AutonomyAndAction
    - SocialNeeds
    - ReproductionAndContinuation
    - DevelopmentAndCapabilityExpansion
    - PositiveSubjectiveExperience
    - SelfRealizationCreativityMeaning
    absolute_need_intensity:
      symbol: N_i_abs(t)
      meaning: Unnormalized absolute intensity of NeedType i at time t.
      components:
        D_i: 'deficit: distance between actual and desired/reference state'
        H_i: severity of consequences if unmet
        U_i: urgency / time-to-harm
        P_i: 'scale: number/share of affected entities'
        Dep_i: dependency of normal existence/functioning on satisfaction
        S_i: subjective significance and revealed preference signals
        R_i: irreversibility of consequences
      formula_status: open
      working_form: N_i_abs(t) = f(D_i, H_i, U_i, P_i, Dep_i, S_i, R_i)
    confidence:
      symbol: C_i(t)
      range: '[0,1]'
      rule: Confidence is stored separately from need intensity; low confidence does not imply low need.
    aggregation:
      dimensions:
      - NeedType
      - EntityGroup
      - Location
      - Time
      working_tensor: N_abs(i,g,l,t)
      rule: NeedInstances are aggregated by NeedType and any selected grouping dimensions before normalization.
    normalized_matrix:
      symbol: D_R(t)
      weight_symbol: w_i,R(t)
      formula: w_i,R(t) = N_i_abs(t) / sum_j N_j_abs(t)
      normalization_constraint: sum_i w_i,R(t) = 1 when H_R(t) > 0
      meaning: Relative structure of currently unmet needs in reference system R.
    absolute_unmet_need_level:
      symbol: H_R(t)
      formula: H_R(t) = sum_i N_i_abs(t)
      meaning: Scalar total absolute level of unmet needs.
      zero_case:
        condition: H_R(t) = 0
        interpretation: All represented needs are satisfied in the selected slice.
        D_R_status: undefined/non-informative because normalization denominator is zero
    data_pipeline:
    - ingest_data
    - validate_schema
    - map_to_entities
    - update_states
    - instantiate_or_update_need_instances
    - compute_need_parameters
    - compute_N_i_abs
    - aggregate_by_need_type_group_location_time
    - compute_H_R
    - normalize_to_D_R_if_H_R_positive
    - update_confidence
    - record_provenance
    - version_snapshot
  changelog:
  - version: '3.1'
    date: '2026-09-05'
    type: structural
    changes:
    - Added NeedType → Subcategory → NeedInstance hierarchy
    - Added 12 working top-level NeedType classes
    - Replaced temporary Q_i need notation with N_i_abs(t)
    - Added H_R(t) as total absolute unmet-need level
    - Separated C_i(t) confidence from need intensity
    - Added working component set D_i,H_i,U_i,P_i,Dep_i,S_i,R_i
    - Added aggregation and normalization rules for D_R(t)
    - Defined behavior for H_R(t)=0
    - Updated live ontology data pipeline
