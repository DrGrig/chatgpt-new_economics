        defect_rate: '[0,1]'
        confidence: '[0,1]'
        time: timestamp/interval
      notes:
      - Product may later also be classified as Resource
    - id: product_need
      source: Product
      target: Need
      cardinality: n:m
      types:
      - directlySatisfies
      - enablesSatisfaction
      - partiallySatisfies
      - negativelyAffects
      parameters:
        effect: '[-1,1]'
        coverage: '[0,1]'
        speed: time to effect
        reach: number/share of affected entities
        duration: effect duration
        confidence: '[0,1]'
        time: timestamp/interval
      formulas:
      - Delta D_N = -f(Product, Need)
    - id: product_state
      source: Product
      target: State
      cardinality: n:m
      types:
      - changesState
      - maintainsState
      - restoresState
      - preventsDeterioration
      - degradesState
